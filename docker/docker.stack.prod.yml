version: '3.8'

services:
  front:
    image: ${IMAGE_REGISTRY_URL}:${IMAGE_REGISTRY_TAG:-latest}
    environment:
      - VITE_BASE_API_URL=${VITE_BASE_API_URL}
      - IMAGE_REGISTRY_URL=${IMAGE_REGISTRY_URL}
      - IMAGE_REGISTRY_TAG=${IMAGE_REGISTRY_TAG:-latest}
    env_file:
      - ../stack.env
    networks:
      - traefik_internal
      - patronage_network
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_internal"
        - "traefik.http.routers.patronage-front-http.rule=Host(`${PREFIX}${DOMAIN}`)"
        - "traefik.http.routers.patronage-front-http.entrypoints=web"
        - "traefik.http.routers.patronage-front-http.middlewares=redirect-to-https"
        - "traefik.http.routers.patronage-front-https.rule=Host(`${PREFIX}${DOMAIN}`)"
        - "traefik.http.routers.patronage-front-https.entrypoints=websecure"
        - "traefik.http.routers.patronage-front-https.tls=true"
        - "traefik.http.routers.patronage-front-https.tls.certresolver=letsencrypt"
        - "traefik.http.services.patronage-front.loadbalancer.server.port=80"
        - "traefik.http.services.patronage-front.loadbalancer.healthcheck.path=/health"
        - "traefik.http.services.patronage-front.loadbalancer.healthcheck.interval=30s"
        - "traefik.http.middlewares.patronage-front-headers.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN"
        - "traefik.http.middlewares.patronage-front-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
        - "traefik.http.middlewares.patronage-front-headers.headers.customResponseHeaders.X-XSS-Protection=1; mode=block"
        - "traefik.http.middlewares.patronage-front-headers.headers.customResponseHeaders.Referrer-Policy=strict-origin-when-cross-origin"
        - "traefik.http.routers.patronage-front-https.middlewares=patronage-front-headers"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  traefik_internal:
    external: true
  patronage_network:
    external: true
