version: '3.8'

services:
  front:
    image: ${IMAGE_REGISTRY_URL}:${IMAGE_REGISTRY_TAG:-dev}
    environment:
      - VITE_BASE_API_URL=${VITE_BASE_API_URL}
      - IMAGE_REGISTRY_URL=${IMAGE_REGISTRY_URL}
      - IMAGE_REGISTRY_TAG=${IMAGE_REGISTRY_TAG:-dev}
    env_file:
      - ../stack.env
    networks:
      - traefik_internal
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
      placement:
        constraints:
          - node.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_internal"
        - "traefik.http.routers.patronage-front-dev-http.rule=Host(`${PREFIX}${DOMAIN}`)"
        - "traefik.http.routers.patronage-front-dev-http.entrypoints=web"
        - "traefik.http.routers.patronage-front-dev-http.middlewares=redirect-to-https"
        - "traefik.http.routers.patronage-front-dev-https.rule=Host(`${PREFIX}${DOMAIN}`)"
        - "traefik.http.routers.patronage-front-dev-https.entrypoints=websecure"
        - "traefik.http.routers.patronage-front-dev-https.tls=true"
        - "traefik.http.routers.patronage-front-dev-https.tls.certresolver=letsencrypt"
        - "traefik.http.services.patronage-front-dev.loadbalancer.server.port=80"
        - "traefik.http.services.patronage-front-dev.loadbalancer.healthcheck.path=/health"
        - "traefik.http.services.patronage-front-dev.loadbalancer.healthcheck.interval=30s"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  traefik_internal:
    external: true
